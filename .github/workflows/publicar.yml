name: Publicar no PyPI
run-name: Publicar mailcore-sdk ${{ inputs.versao }}

# Publicador PyPI: projeto mailcore-sdk, proprietário mailcore-hq,
# repositório mailcore-python, arquivo publicar.yml, sem environment.
# O relacionamento corresponde a este repositório e arquivo de workflow.
on:
  workflow_dispatch:
    inputs:
      versao:
        description: Versão exata a publicar
        type: choice
        required: true
        default: 0.2.0a1
        options:
          - 0.2.0a1

permissions:
  contents: read

concurrency:
  group: publicar-pypi-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preparar:
    name: Construir e verificar os pacotes
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.repository == 'mailcore-hq/mailcore-python' &&
          github.ref == 'refs/heads/main' && inputs.versao == '0.2.0a1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSAO_PUBLICACAO: ${{ inputs.versao }}
    steps:
      - name: Obter o código da execução
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar o Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Conferir a identidade e a versão
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          projeto = tomllib.loads(Path('pyproject.toml').read_text())['project']
          assert projeto['name'] == 'mailcore-sdk'
          assert projeto['version'] == os.environ['VERSAO_PUBLICACAO'] == '0.2.0a1'
          PY

      - name: Instalar as ferramentas de distribuição
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            build==1.6.1 setuptools==84.2.1 wheel==0.48.0 twine==7.0.0

      - name: Construir e conferir a distribuição
        shell: bash
        run: |
          python -m build --no-isolation
          python -m twine check --strict \
            dist/mailcore_sdk-0.2.0a1-py3-none-any.whl \
            dist/mailcore_sdk-0.2.0a1.tar.gz
          sha256sum dist/mailcore_sdk-0.2.0a1-py3-none-any.whl \
            dist/mailcore_sdk-0.2.0a1.tar.gz

      - name: Instalar a wheel em um consumidor isolado
        shell: bash
        run: |
          diretorio_consumidor="$(mktemp -d)"
          trap 'rm -rf "$diretorio_consumidor"' EXIT
          python -m venv "$diretorio_consumidor/venv"
          "$diretorio_consumidor/venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            "$GITHUB_WORKSPACE/dist/mailcore_sdk-0.2.0a1-py3-none-any.whl"
          cd "$diretorio_consumidor"
          "$diretorio_consumidor/venv/bin/python" - <<'PY'
          import importlib.metadata
          import sys
          from pathlib import Path

          import mailcore

          assert importlib.metadata.version('mailcore-sdk') == mailcore.VERSAO == '0.2.0a1'
          assert Path(mailcore.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          assert Path(mailcore.__file__).with_name('py.typed').is_file()
          with mailcore.Cliente('mc_verificacao_sintetica') as cliente:
              assert cliente.emails and cliente.contatos.exportacoes and cliente.caixas.conversas.emails
          print('Instalação isolada aprovada: mailcore-sdk 0.2.0a1.')
          PY

      - name: Guardar somente os dois pacotes verificados
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mailcore-sdk-${{ inputs.versao }}
          path: |
            dist/mailcore_sdk-0.2.0a1-py3-none-any.whl
            dist/mailcore_sdk-0.2.0a1.tar.gz
          if-no-files-found: error
          retention-days: 7

  publicar:
    name: Publicar os pacotes verificados no PyPI
    needs: preparar
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.repository == 'mailcore-hq/mailcore-python' &&
          github.ref == 'refs/heads/main' && inputs.versao == '0.2.0a1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Recuperar os pacotes desta execução
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mailcore-sdk-${{ inputs.versao }}
          path: dist/
          digest-mismatch: error

      - name: Publicar com a identidade OIDC desta execução
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true
          verify-metadata: true
          skip-existing: false
          print-hash: true
