[build-system]
requires = ["setuptools>=84,<85", "wheel>=0.48,<0.49"]
build-backend = "setuptools.build_meta"

[project]
name = "mailcore-sdk"
version = "0.2.0a1"
description = "Cliente Python da API Mailcore com recursos síncronos e assíncronos."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "Mailcore"}]
dependencies = ["httpx>=0.28.1,<0.29", "anyio>=4.8,<5"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://mailcore.com.br"
Repository = "https://github.com/mailcore-hq/mailcore-python"
Issues = "https://github.com/mailcore-hq/mailcore-python/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mailcore = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/mailcore"]

[[tool.mypy.overrides]]
module = ["exemplos.*"]
ignore_errors = true
